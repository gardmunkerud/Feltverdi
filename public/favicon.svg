<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Granite tile: charcoal stone with feldspar, quartz and mica flecks -->
  <rect width="64" height="64" rx="12" fill="#2b2926"/>
  <g opacity="0.9">
    <circle cx="9" cy="11" r="1.3" fill="#c9a89a"/><circle cx="19" cy="7" r="0.9" fill="#e9e4da"/>
    <circle cx="52" cy="9" r="1.1" fill="#c9a89a"/><circle cx="57" cy="20" r="0.8" fill="#e9e4da"/>
    <circle cx="7" cy="28" r="0.8" fill="#e9e4da"/><circle cx="12" cy="55" r="1.2" fill="#c9a89a"/>
    <circle cx="27" cy="58" r="0.8" fill="#e9e4da"/><circle cx="56" cy="54" r="1.0" fill="#c9a89a"/>
    <circle cx="44" cy="58" r="0.7" fill="#e9e4da"/><circle cx="33" cy="6" r="0.7" fill="#c9a89a"/>
  </g>
  <!-- Strata: three layers, the middle one is the reservoir -->
  <path d="M10 24 C 20 20, 30 27, 40 23 S 54 21, 54 21" fill="none" stroke="#e9e4da" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 34 C 20 30, 30 37, 40 33 S 54 31, 54 31" fill="none" stroke="#c0573e" stroke-width="4" stroke-linecap="round"/>
  <path d="M10 44 C 20 40, 30 47, 40 43 S 54 41, 54 41" fill="none" stroke="#e9e4da" stroke-width="3" stroke-linecap="round"/>
  <!-- Well into the reservoir -->
  <path d="M40 12 L40 32" stroke="#e9e4da" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="40" cy="12" r="3.2" fill="#e9e4da"/>
</svg>
